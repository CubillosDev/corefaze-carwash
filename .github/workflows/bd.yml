# Integración continua de la base de datos (supabase/).
# Pendiente: se activa cuando exista código. Mientras tanto solo se ejecuta a
# mano, para que GitHub no registre un fallo en cada push.
name: CI base de datos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pendiente:
    name: Pendiente
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aviso
        run: echo "Pendiente; el flujo de supabase se activa cuando exista código."
