# Integración continua de la API (apps/api).
# Las pruebas de integración necesitan Supabase local (migraciones + seed):
# se levanta con la CLI antes de correrlas. Las llaves de esa base local son
# las fijas y públicas de la CLI; aquí no se usa ningún secreto.
name: CI api

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/api/**"
      - "supabase/**"
      - "packages/contratos/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/api/**"
      - "supabase/**"
      - "packages/contratos/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, pruebas y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint:api

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Levantar Supabase local (migraciones + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api

      - name: Pruebas
        run: npm run test:api

      - name: Auditoría de dependencias
        run: npm audit --workspace apps/api --audit-level=high
