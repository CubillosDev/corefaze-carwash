# Integración continua de la API (apps/api).
# Corre lint, pruebas y auditoría de dependencias cuando cambian la API, los
# contratos compartidos o las dependencias de la raíz (workspaces de npm).
name: CI api

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/api/**"
      - "packages/contratos/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/api/**"
      - "packages/contratos/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, pruebas y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint:api

      - name: Pruebas
        run: npm run test:api

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
